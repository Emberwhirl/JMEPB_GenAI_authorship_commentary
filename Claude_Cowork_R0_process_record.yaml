prompts:
  - id: fable-1
    date: "2026-08-07"
    purpose: literature search and initial drafting
    text: |
      There are recently two calls for commentaries, one in the journal of medical ethics and the other in its sister journal that was recently released called JME practical bioethics. These two calls are interconnected, and I've applied to both of them. Luckily, my proposal was successful for the JME practical bioethics. But for you to understand the general picture, I attached a ZIP file containing the relevant information for both of these two calls. These two calls were actually published in commentary format and include some tables and figures, so I advise you to take a close look at them carefully.

      I also attached both of my proposals, in DOCX format. I have to emphasize that I was only accepted for the JME practical bioethics, but not JME. But we can actually combine the pearls of both proposals together and write a nice commentary. One of the strong argument that I proposed is the analogy of the failed attempt of "data available upon reasonable request", where the original purpose is to promote data sharing and transparency but in reality most requests are conveniently ignored under the guise of an unread inbox. If we now just mandate AI use declaration without asking the authors to provide further details, this would end up being another data availability statement or conflict of interest statement, where most authors tend to use broad and empty wording to get away with. I think there are a lot of commentaries and correspondence letters on this topic out there on mocking or criticising "data available upon reasonable request"; I want you to spawn subagents to run comprehensive search on these and then highlight some of the best or most influential pieces so I could actually reference them in the commentary I will write.

      Last but not least, I'm a great fan of George Orwell, and I believe that his critical thinking framework, his sense of irony and sarcasm, his writing style for journalism and essays would be a huge help for writing a commentary like this. Use /george-orwell-skill  to draft the commentary in orwellian style. It should be a pleasurable read for potential readers.
  - id: fable-2
    date: "2026-08-07"
    purpose: length and format constraints and display-item suggestions
    text: |
      It's too long. The following are the requirements:

      Invited commentaries should be about 1000 words. They are due (at the latest) 1 month after the author receives the invitation; however, earlier submissions are welcomed, and accepted pieces will be published online as soon as possible. In lieu of an abstract, the first section should be labelled ‘Précis’ with a concise overview of what the commentary argues. Up to two tables or illustrations and up to 10 references (with some flexibility, as needed) may be included.

      Please also suggest what illustrations or tables can i possibly add to the commentary
  - id: fable-3
    date: "2026-08-14"
    purpose: rebalance the draft toward the proposals and source editorial
    text: |
      I think the main problem for this current draft is that you're focusing too much on the analogy of available upon reasonable requests, and you're deviating too much from the original proposal. In the original proposal, um, apart from the available upon reasonable request part, I actually, uh, try to engage with the questions and arguments raised by the, uh, the official editorial as much as possible. For example, I added a sixth candidate view on top of the five views surveyed in the original editorial, I proposed an extension of the death analogy. I proposed a human anchor for transparency policies. And, importantly, I also provided an answer to the headline question, which is authorized essays could theoretically be published in the future given an answerable respondent and inspectable provenance. I do believe, uh, engaging and answering the questions and arguments raised by the original editorial is an important part of this commentary and is one of the most important criteria of considering whether this manuscript could be published in this journal. Of course, the available upon reasonable request analogy is an important part and is one of the most important highlight of this commentary. But you cannot just purely focus on this topic without, um, closely touching on what the original editorial has written.

